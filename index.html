<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D&D Campaign Options</title>

<!-- Marked.js for parsing Markdown -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
    /* =========================================================
       D&D CAMPAIGN OPTIONS - TEMPLATE
       You can customize colors, fonts and spacing here.
       ========================================================= */

    :root {
        --bg: #151318;
        --panel: #211e26;
        --panel-light: #2b2731;
        --border: #49424f;
        --text: #eee9f2;
        --muted: #aaa1b0;
        --accent: #9b6bc7;
        --accent-dark: #68458c;
        --hover: #352f3d;
        --selected: #443354;
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: Georgia, "Times New Roman", serif;
    }

    /* ---------- HEADER ---------- */

    header {
        text-align: center;
        padding: 28px 20px 20px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
    }

    header h1 {
        margin: 0 0 18px;
        font-size: 2rem;
        letter-spacing: 0.08em;
    }

    /* Top-level Species / Classes switch */
    .mode-switch {
        display: inline-flex;
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
    }

    .mode-button {
        border: 0;
        padding: 12px 35px;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-weight: bold;
        cursor: pointer;
    }

    .mode-button:hover {
        background: var(--hover);
        color: var(--text);
    }

    .mode-button.active {
        background: var(--accent-dark);
        color: white;
    }

    /* ---------- MAIN TWO-COLUMN AREA ---------- */

    .layout {
        display: grid;
        grid-template-columns: minmax(260px, 350px) 1fr;
        min-height: calc(100vh - 150px);
    }

    /* ---------- LEFT TREE ---------- */

    .sidebar {
        border-right: 1px solid var(--border);
        background: var(--panel);
        padding: 18px;
        overflow-y: auto;
    }

    .tree-title {
        color: var(--muted);
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        margin-bottom: 12px;
    }

    .tree {
        list-style: none;
        margin: 0;
        padding: 0;
    }

    .tree ul {
        list-style: none;
        margin: 0 0 0 18px;
        padding: 0 0 0 12px;
        border-left: 1px solid var(--border);
    }

    /* Parent category */
    .tree details {
        margin: 2px 0;
    }

    .tree summary {
        cursor: pointer;
        padding: 8px 10px;
        border-radius: 6px;
        font-weight: bold;
        user-select: none;
    }

    .tree summary:hover {
        background: var(--hover);
    }

    /* Remove the browser's default triangle */
    .tree summary {
        list-style: none;
    }

    .tree summary::-webkit-details-marker {
        display: none;
    }

    .tree summary::before {
        content: "▶";
        display: inline-block;
        width: 18px;
        color: var(--muted);
        font-size: 0.7em;
        transition: transform 0.15s ease;
    }

    .tree details[open] > summary::before {
        transform: rotate(90deg);
    }

    /* Actual selectable entries */
    .tree-item {
        display: block;
        width: 100%;
        border: 0;
        background: transparent;
        color: var(--text);
        text-align: left;
        font: inherit;
        padding: 8px 10px;
        border-radius: 6px;
        cursor: pointer;
    }

    .tree-item:hover {
        background: var(--hover);
    }

    .tree-item.selected {
        background: var(--selected);
        color: white;
        outline: 1px solid var(--accent);
    }

    /* ---------- RIGHT INFO PANEL ---------- */

    .content {
        padding: 30px;
        overflow-y: auto;
    }

    .info-card {
        max-width: 1000px;
        margin: 0 auto;
    }

    .info-image {
        width: 100%;
        max-height: 430px;
        object-fit: contain;
        height: auto;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--panel);
        display: block;
        margin-bottom: 24px;
    }

    .placeholder-image {
        height: 300px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--panel);
        border: 1px dashed var(--border);
        border-radius: 10px;
        color: var(--muted);
        margin-bottom: 24px;
    }

    .info-card h2 {
        margin: 0 0 8px;
        font-size: 2.2rem;
    }

    .category-label {
        color: var(--accent);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        font-size: 0.8rem;
        font-weight: bold;
        margin-bottom: 20px;
    }

    /* Dynamic Markdown Render Styling */
    .description, .markdown-content {
        color: var(--text);
        line-height: 1.7;
        font-size: 1.05rem;
    }

    .description h1, .description h2, .description h3, .description h4 {
        color: var(--text);
        margin-top: 1.2em;
        margin-bottom: 0.5em;
    }

    .description strong {
        color: #fff;
    }

    .description p {
        margin: 0 0 1em 0;
    }

    .description ul, .description ol {
        padding-left: 22px;
        color: var(--text);
        margin: 0 0 1em 0;
    }

    .info-section {
        margin-top: 28px;
        padding-top: 20px;
        border-top: 1px solid var(--border);
    }

    .info-section h3 {
        margin: 0 0 10px;
    }

    .info-section ul {
        padding-left: 22px;
        line-height: 1.7;
        color: var(--muted);
    }

    /* ---------- MOBILE ---------- */

    @media (max-width: 750px) {
        .layout {
            grid-template-columns: 1fr;
        }

        .sidebar {
            border-right: 0;
            border-bottom: 1px solid var(--border);
            max-height: 45vh;
        }

        .content {
            padding: 20px;
        }

        .mode-button {
            padding: 10px 22px;
        }
    }
</style>
</head>

<body>

<header>
    <h1>D&D CAMPAIGN OPTIONS</h1>

    <div class="mode-switch">
        <button class="mode-button active" data-mode="species">
            Species
        </button>

        <button class="mode-button" data-mode="classes">
            Classes
        </button>
    </div>
</header>


<div class="layout">

    <!-- =====================================================
         LEFT SIDE: TREE MENU
         ===================================================== -->

    <aside class="sidebar">

        <div class="tree-title" id="tree-title">
            Available Species
        </div>

        <nav aria-label="Campaign options">
            <div id="tree-container"></div>
        </nav>

    </aside>


    <!-- =====================================================
         RIGHT SIDE: INFORMATION
         ===================================================== -->

    <main class="content">

        <article class="info-card" id="info-card">

            <div class="placeholder-image" id="image-placeholder">
                Select an option from the list
            </div>

            <img
                id="info-image"
                class="info-image"
                src=""
                alt=""
                style="display: none;"

            <div class="category-label" id="info-category">
                Campaign Options
            </div>

            <h2 id="info-name">
                Welcome
            </h2>

            <div class="description" id="info-description">

            </div>

            <!-- Optional additional section -->
            <section class="info-section" id="features-section" style="display: none;">
                <h3>Features</h3>
                <div class="description" id="info-features"></div>
            </section>

            <!-- Optional additional section -->
            <section class="info-section" id="notes-section" style="display: none;">
                <h3>Notes</h3>
                <div class="description" id="info-notes"></div>
            </section>

        </article>

    </main>

</div>

Created by the god Corellon, the first elves could change their forms at will. They lost this ability when Corellon cursed them for plotting with the deity Lolth, who tried and failed to usurp Corellon's dominion. When Lolth was cast into the Abyss, most elves renounced her and earned Corellon's forgiveness, but that which Corellon had taken from them was lost forever.

No longer able to shape-shift at will, the elves retreated to the Feywild, where their sorrow was deepened by that plane's influence. Over time, curiosity led many of them to explore other planes of existence, including worlds in the Material Plane.

Elves have pointed ears and lack facial and body hair. They live for around 750 years, and they don't sleep but instead enter a trance when they need to rest. In that state, they remain aware of their surroundings while immersing themselves in memories and meditations.

An environment subtly transforms elves after they inhabit it for a millennium or more, and it grants them certain kinds of magic. Drow, high elves, and wood elves are examples of elves who have been transformed thus.

#### Drow

Drow typically dwell in the Underdark and have been shaped by it. Some drow individuals and societies avoid the Underdark altogether yet carry its magic. In the Eberron setting, for example, drow dwell in rainforests and cyclopean ruins on the continent of Xen'drik.

#### High Elves

High elves have been infused with the magic of crossings between the Feywild and the Material Plane. On some worlds, high elves refer to themselves by other names. For example, they call themselves sun or moon elves in the Forgotten Realms setting, Silvanesti and Qualinesti in the Dragonlance setting, and Aereni in the Eberron setting.

#### Wood Elves

Wood elves carry the magic of primeval forests within themselves. They are known by many other names, including wild elves, green elves, and forest elves. Grugach are reclusive wood elves of the Greyhawk setting, while the Kagonesti and the Tairnadal are wood elves of the Dragonlance and Eberron settings, respectively.

### Lorwyn

The horns of Lorwyn elves are stubby like a goat's or curved like a ram's, but always ridged. Their pointed ears are long and slender.

In Lorwyn, elves value beauty above all, though what any given elf deems beautiful can seem arbitrary. Some Lorwyn elves assume authority over the land's other peoples, using their fallen empire to support their claims.

These elves blame the fall of their empire on outside threats, especially the Phyrexian invasion (see *"Lorwyn-Shadowmoor's History"*). Though the invasion was the empire's death knell, its people's self-importance and unwillingness to collaborate with other species had already led to the empire's decline.

### Shadowmoor

Shadowmoor elves' horns are long, wavy, and covered with a rough, thorny texture. Their pointed ears are usually longer than those of their Lorwyn counterparts.

Like Lorwyn elves, Shadowmoor elves protect beauty, though a Shadowmoor elf's definition of "beautiful" can be abstract. Many of their kind believe beauty is gained or lost in accordance with one's actions; in particular, they consider heroism and self-sacrifice the highest forms of beauty.

Bloomseekers are Shadowmoor elves who study and explore Lorwyn. Each one carries a *Reliquary of Twilight* (see the introduction). Alongside Safewrights—Shadowmoor elves who venture across their realm in search of beautiful things—Bloomseekers are among the most trusted and revered members of their society.

/* ============================================================
   APPLICATION CODE
   ============================================================ */

let currentMode = "species";
marked.use({
  renderer: {
    link({ href, title, text }) {
      const titleAttr = title ? ` title="${title}"` : '';
      return `<a href="${href}"${titleAttr} target="_blank" rel="noopener noreferrer">${text}</a>`;
    }
  }
});
const treeContainer = document.getElementById("tree-container");
const treeTitle = document.getElementById("tree-title");

const infoImage = document.getElementById("info-image");
const imagePlaceholder = document.getElementById("image-placeholder");

const infoCategory = document.getElementById("info-category");
const infoName = document.getElementById("info-name");
const infoDescription = document.getElementById("info-description");

const featuresSection = document.getElementById("features-section");
const featuresList = document.getElementById("info-features");

const notesSection = document.getElementById("notes-section");
const notesText = document.getElementById("info-notes");


/* ---------- CREATE TREE ---------- */

function createTree(items, parentList, level = 0) {

    items.forEach(item => {

        const li = document.createElement("li");

        const hasChildren =
            Array.isArray(item.children) &&
            item.children.length > 0;

        if (hasChildren) {

            const details = document.createElement("details");

            if (level === 0) {
                details.open = true;
            }

            const summary = document.createElement("summary");
            summary.textContent = item.name;

            summary.addEventListener("click", () => {
                showInfo(item, level);
            });

            details.appendChild(summary);

            const childList = document.createElement("ul");
            createTree(item.children, childList, level + 1);

            details.appendChild(childList);
            li.appendChild(details);

        } else {

            const button = document.createElement("button");

            button.className = "tree-item";
            button.textContent = item.name;
            button.type = "button";

            button.addEventListener("click", () => {

                document
                    .querySelectorAll(".tree-item.selected")
                    .forEach(element => {
                        element.classList.remove("selected");
                    });

                button.classList.add("selected");

                showInfo(item, level);
            });

            li.appendChild(button);
        }

        parentList.appendChild(li);
    });
}


/* ---------- DISPLAY INFORMATION ---------- */

function showInfo(item, level) {

    infoName.textContent = item.name;

    if (currentMode === "species") {
        infoCategory.textContent =
            level === 0 ? "Species" : "Species Variant";
    } else {
        infoCategory.textContent =
            level === 0 ? "Class" : "Subclass";
    }

    /* Render Markdown for Description */
    if (item.description && item.description.trim() !== "") {
        infoDescription.innerHTML = marked.parse(item.description);
    } else {
        infoDescription.innerHTML = "<p>No description has been added yet.</p>";
    }

    /* ---------- IMAGE ---------- */

    if (item.image && item.image.trim() !== "") {

        infoImage.src = item.image;
        infoImage.alt = item.name;
        infoImage.style.display = "block";
        imagePlaceholder.style.display = "none";

        infoImage.onerror = () => {
            infoImage.style.display = "none";
            imagePlaceholder.style.display = "flex";
            imagePlaceholder.textContent =
                "Image could not be loaded.";
        };

    } else {

        infoImage.style.display = "none";
        imagePlaceholder.style.display = "flex";
        imagePlaceholder.textContent =
            "No image added.";
    }


    /* ---------- FEATURES (MARLOWED LIST OR STRINGS) ---------- */

    if (item.features && item.features.length > 0) {

        if (Array.isArray(item.features)) {
            const combinedMarkdown = item.features.map(f => `- ${f}`).join('\n');
            featuresList.innerHTML = marked.parse(combinedMarkdown);
        } else {
            featuresList.innerHTML = marked.parse(item.features);
        }

        featuresSection.style.display = "block";

    } else {

        featuresSection.style.display = "none";
    }


    /* ---------- NOTES ---------- */

    if (item.notes && item.notes.trim() !== "") {

        notesText.innerHTML = marked.parse(item.notes);
        notesSection.style.display = "block";

    } else {

        notesSection.style.display = "none";
    }
}


/* ---------- BUILD TREE ---------- */

function renderTree() {

    treeContainer.innerHTML = "";

    const list = document.createElement("ul");
    list.className = "tree";

    createTree(campaignData[currentMode], list);

    treeContainer.appendChild(list);

    treeTitle.textContent =
        currentMode === "species"
            ? "Available Species"
            : "Available Classes";
}


/* ---------- SPECIES / CLASS SWITCH ---------- */

document.querySelectorAll(".mode-button").forEach(button => {

    button.addEventListener("click", () => {

        currentMode = button.dataset.mode;

        document
            .querySelectorAll(".mode-button")
            .forEach(button => {
                button.classList.remove("active");
            });

        button.classList.add("active");

        renderTree();

        infoName.textContent = "Select an option";
        infoCategory.textContent = "Campaign Options";
        infoDescription.innerHTML =
            "<p>Select an option from the list to see its information.</p>";

        infoImage.style.display = "none";
        imagePlaceholder.style.display = "flex";
        imagePlaceholder.textContent =
            "Select an option from the list";

        featuresSection.style.display = "none";
        notesSection.style.display = "none";
    });
});


/* ---------- INITIAL RENDER ---------- */

renderTree();

</script>
