<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D&D Campaign Options</title>

<!-- Marked.js for parsing Markdown -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
    /* =========================================================
       D&D CAMPAIGN OPTIONS - TEMPLATE
       You can customize colors, fonts and spacing here.
       ========================================================= */

    :root {
        --bg: #151318;
        --panel: #211e26;
        --panel-light: #2b2731;
        --border: #49424f;
        --text: #eee9f2;
        --muted: #aaa1b0;
        --accent: #9b6bc7;
        --accent-dark: #68458c;
        --hover: #352f3d;
        --selected: #443354;
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: Georgia, "Times New Roman", serif;
    }

    /* ---------- HEADER ---------- */

    header {
        text-align: center;
        padding: 28px 20px 20px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
    }

    header h1 {
        margin: 0 0 18px;
        font-size: 2rem;
        letter-spacing: 0.08em;
    }

    /* Top-level Species / Classes switch */
    .mode-switch {
        display: inline-flex;
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
    }

    .mode-button {
        border: 0;
        padding: 12px 35px;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-weight: bold;
        cursor: pointer;
    }

    .mode-button:hover {
        background: var(--hover);
        color: var(--text);
    }

    .mode-button.active {
        background: var(--accent-dark);
        color: white;
    }

    /* ---------- MAIN TWO-COLUMN AREA ---------- */

    .layout {
        display: grid;
        grid-template-columns: minmax(260px, 350px) 1fr;
        min-height: calc(100vh - 150px);
    }

    /* ---------- LEFT TREE ---------- */

    .sidebar {
        border-right: 1px solid var(--border);
        background: var(--panel);
        padding: 18px;
        overflow-y: auto;
    }

    .tree-title {
        color: var(--muted);
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        margin-bottom: 12px;
    }

    .tree {
        list-style: none;
        margin: 0;
        padding: 0;
    }

    .tree ul {
        list-style: none;
        margin: 0 0 0 18px;
        padding: 0 0 0 12px;
        border-left: 1px solid var(--border);
    }

    /* Parent category */
    .tree details {
        margin: 2px 0;
    }

    .tree summary {
        cursor: pointer;
        padding: 8px 10px;
        border-radius: 6px;
        font-weight: bold;
        user-select: none;
    }

    .tree summary:hover {
        background: var(--hover);
    }

    /* Remove the browser's default triangle */
    .tree summary {
        list-style: none;
    }

    .tree summary::-webkit-details-marker {
        display: none;
    }

    .tree summary::before {
        content: "▶";
        display: inline-block;
        width: 18px;
        color: var(--muted);
        font-size: 0.7em;
        transition: transform 0.15s ease;
    }

    .tree details[open] > summary::before {
        transform: rotate(90deg);
    }

    /* Actual selectable entries */
    .tree-item {
        display: block;
        width: 100%;
        border: 0;
        background: transparent;
        color: var(--text);
        text-align: left;
        font: inherit;
        padding: 8px 10px;
        border-radius: 6px;
        cursor: pointer;
    }

    .tree-item:hover {
        background: var(--hover);
    }

    .tree-item.selected {
        background: var(--selected);
        color: white;
        outline: 1px solid var(--accent);
    }

    /* ---------- RIGHT INFO PANEL ---------- */

    .content {
        padding: 30px;
        overflow-y: auto;
    }

    .info-card {
        max-width: 1000px;
        margin: 0 auto;
    }

    .info-image {
        width: 100%;
        max-height: 430px;
        object-fit: contain;
        height: auto;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--panel);
        display: block;
        margin-bottom: 24px;
    }

    .placeholder-image {
        height: 300px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--panel);
        border: 1px dashed var(--border);
        border-radius: 10px;
        color: var(--muted);
        margin-bottom: 24px;
    }

    .info-card h2 {
        margin: 0 0 8px;
        font-size: 2.2rem;
    }

    .category-label {
        color: var(--accent);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        font-size: 0.8rem;
        font-weight: bold;
        margin-bottom: 20px;
    }

    /* Dynamic Markdown Render Styling */
    .description, .markdown-content {
        color: var(--text);
        line-height: 1.7;
        font-size: 1.05rem;
    }

    .description h1, .description h2, .description h3, .description h4 {
        color: var(--text);
        margin-top: 1.2em;
        margin-bottom: 0.5em;
    }

    .description strong {
        color: #fff;
    }

    .description p {
        margin: 0 0 1em 0;
    }

    .description ul, .description ol {
        padding-left: 22px;
        color: var(--text);
        margin: 0 0 1em 0;
    }

    .info-section {
        margin-top: 28px;
        padding-top: 20px;
        border-top: 1px solid var(--border);
    }

    .info-section h3 {
        margin: 0 0 10px;
    }

    .info-section ul {
        padding-left: 22px;
        line-height: 1.7;
        color: var(--muted);
    }

    /* ---------- MOBILE ---------- */

    @media (max-width: 750px) {
        .layout {
            grid-template-columns: 1fr;
        }

        .sidebar {
            border-right: 0;
            border-bottom: 1px solid var(--border);
            max-height: 45vh;
        }

        .content {
            padding: 20px;
        }

        .mode-button {
            padding: 10px 22px;
        }
    }
</style>
</head>

<body>

<header>
    <h1>D&D CAMPAIGN OPTIONS</h1>

    <div class="mode-switch">
        <button class="mode-button active" data-mode="species">
            Species
        </button>

        <button class="mode-button" data-mode="classes">
            Classes

<div class="layout">

         LEFT SIDE: TREE MENU

         RIGHT SIDE: INFORMATION
         ===================================================== -->

            </div>

            <img

            </div>

            <section class="info-section" id="features-section" style="display: none;">

            </section>

            <!-- Optional additional section -->

                <h3>Notes</h3>

            </section>

        </article>

    </main>

</div>

/* ============================================================
   APPLICATION CODE
   ============================================================ */

let currentMode = "species";

const treeContainer = document.getElementById("tree-container");
const treeTitle = document.getElementById("tree-title");

const infoImage = document.getElementById("info-image");
const imagePlaceholder = document.getElementById("image-placeholder");

const infoCategory = document.getElementById("info-category");
const infoName = document.getElementById("info-name");
const infoDescription = document.getElementById("info-description");

const featuresSection = document.getElementById("features-section");
const featuresList = document.getElementById("info-features");

const notesSection = document.getElementById("notes-section");
const notesText = document.getElementById("info-notes");


/* ---------- CREATE TREE ---------- */

function createTree(items, parentList, level = 0) {

    items.forEach(item => {

        const li = document.createElement("li");

        const hasChildren =
            Array.isArray(item.children) &&
            item.children.length > 0;

        if (hasChildren) {

            const details = document.createElement("details");

            if (level === 0) {
                details.open = true;
            }

            const summary = document.createElement("summary");
            summary.textContent = item.name;

            summary.addEventListener("click", () => {
                showInfo(item, level);
            });

            details.appendChild(summary);

            const childList = document.createElement("ul");
            createTree(item.children, childList, level + 1);

            details.appendChild(childList);
            li.appendChild(details);

        } else {

            const button = document.createElement("button");

            button.className = "tree-item";
            button.textContent = item.name;
            button.type = "button";

            button.addEventListener("click", () => {

                document
                    .querySelectorAll(".tree-item.selected")
                    .forEach(element => {
                        element.classList.remove("selected");
                    });

                button.classList.add("selected");

                showInfo(item, level);
            });

            li.appendChild(button);
        }

        parentList.appendChild(li);
    });
}


/* ---------- DISPLAY INFORMATION ---------- */

function showInfo(item, level) {

    infoName.textContent = item.name;

    if (currentMode === "species") {
        infoCategory.textContent =
            level === 0 ? "Species" : "Species Variant";
    } else {
        infoCategory.textContent =
            level === 0 ? "Class" : "Subclass";
    }

    /* Render Markdown for Description */
    if (item.description && item.description.trim() !== "") {
        infoDescription.innerHTML = marked.parse(item.description);
    } else {
        infoDescription.innerHTML = "<p>No description has been added yet.</p>";
    }

    /* ---------- IMAGE ---------- */

    if (item.image && item.image.trim() !== "") {

        infoImage.src = item.image;
        infoImage.alt = item.name;
        infoImage.style.display = "block";
        imagePlaceholder.style.display = "none";

        infoImage.onerror = () => {
            infoImage.style.display = "none";
            imagePlaceholder.style.display = "flex";
            imagePlaceholder.textContent =
                "Image could not be loaded.";
        };

    } else {

        infoImage.style.display = "none";
        imagePlaceholder.style.display = "flex";
        imagePlaceholder.textContent =
            "No image added.";
    }


    /* ---------- FEATURES (MARLOWED LIST OR STRINGS) ---------- */

    if (item.features && item.features.length > 0) {

        if (Array.isArray(item.features)) {
            const combinedMarkdown = item.features.map(f => `- ${f}`).join('\n');
            featuresList.innerHTML = marked.parse(combinedMarkdown);
        } else {
            featuresList.innerHTML = marked.parse(item.features);
        }

        featuresSection.style.display = "block";

    } else {

        featuresSection.style.display = "none";
    }


    /* ---------- NOTES ---------- */

    if (item.notes && item.notes.trim() !== "") {

        notesText.innerHTML = marked.parse(item.notes);
        notesSection.style.display = "block";

    } else {

        notesSection.style.display = "none";
    }
}


/* ---------- BUILD TREE ---------- */

function renderTree() {

    treeContainer.innerHTML = "";

    const list = document.createElement("ul");
    list.className = "tree";

    createTree(campaignData[currentMode], list);

    treeContainer.appendChild(list);

    treeTitle.textContent =
        currentMode === "species"
            ? "Available Species"
            : "Available Classes";
}


/* ---------- SPECIES / CLASS SWITCH ---------- */

document.querySelectorAll(".mode-button").forEach(button => {

    button.addEventListener("click", () => {

        currentMode = button.dataset.mode;

        document
            .querySelectorAll(".mode-button")
            .forEach(button => {
                button.classList.remove("active");
            });

        button.classList.add("active");

        renderTree();

        infoName.textContent = "Select an option";
        infoCategory.textContent = "Campaign Options";
        infoDescription.innerHTML =
            "<p>Select an option from the list to see its information.</p>";

        infoImage.style.display = "none";
        imagePlaceholder.style.display = "flex";
        imagePlaceholder.textContent =
            "Select an option from the list";

        featuresSection.style.display = "none";
        notesSection.style.display = "none";
    });
});


/* ---------- INITIAL RENDER ---------- */

renderTree();

</script>

</body>
